[project]
name = "bbg-mcp"
version = "0.1.0"
description = "MCP server exposing Bloomberg Desktop API (Terminal) data to a local AI client"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2",
]
# blpapi is not on PyPI; install it separately from Bloomberg's index (see README).

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bbg-mcp = "bbg_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bbg_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
