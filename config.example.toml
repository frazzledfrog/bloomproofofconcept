# Copy to config.toml and point BBG_MCP_CONFIG at it. Every key is optional.

backend = "blpapi"        # "blpapi" (live Terminal) or "mock" (synthetic data)
host = "localhost"
port = 8194
timeout_seconds = 30

# Per-call limits
max_securities = 25
max_fields = 10
max_history_days = 366
max_intraday_days = 140
max_rows_per_security = 400

# Approximate daily hit ceiling (security x field per request). Keep this well
# below your Bloomberg DAPI limit; check usage with WAPI <GO> / bbg_status.
daily_hit_budget = 20000
state_dir = "~/.bbg_mcp"  # usage counter and log file live here

# Cache lifetimes in seconds
cache_ttl_history = 21600
cache_ttl_reference = 60
cache_ttl_news = 120

# News: "signals" ranks topic baskets by the news fields below; "disabled" turns news off.
news_mode = "signals"
# First field is used for ranking; verify names with scripts/probe_news.py
news_signal_fields = ["NEWS_HEAT_READ_DMAX", "NEWS_HEAT_PUB_DAVG", "NEWS_SENTIMENT_DAILY_AVG"]

# Keep this table last: every key after it belongs to news_topics.
[news_topics]
markets = ["SPX Index", "INDU Index", "CCMP Index", "SX5E Index", "NKY Index"]
economics = ["USGG10YR Index", "CPI YOY Index", "NFP TCH Index", "DXY Curncy"]
energy = ["CO1 Comdty", "CL1 Comdty", "NG1 Comdty", "XOM US Equity", "SHEL LN Equity"]
metals = ["XAU Curncy", "XAG Curncy", "HG1 Comdty", "BHP AU Equity"]
tech = ["AAPL US Equity", "MSFT US Equity", "NVDA US Equity", "GOOGL US Equity", "AMZN US Equity"]
financials = ["JPM US Equity", "GS US Equity", "HSBA LN Equity", "BAC US Equity"]
fx = ["EURUSD Curncy", "USDJPY Curncy", "GBPUSD Curncy", "USDCNH Curncy"]
crypto = ["XBTUSD Curncy", "XETUSD Curncy"]
